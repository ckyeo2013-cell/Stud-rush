name: Build App
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v5
      with: { distribution: 'temurin', java-version: '17' }
    - uses: android-actions/setup-android@v3
      with: { packages: 'build-tools;34.0.0 platforms;android-34' }
    - run: npm install -g @capacitor/cli @capacitor/core @capacitor/android && npx cap init Game com.game.app --web-dir . && npx cap add android && npx cap sync android
    - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
    - uses: actions/upload-artifact@v4
      with:
        name: my-app
        path: android/app/build/outputs/apk/debug/app-debug.apk
